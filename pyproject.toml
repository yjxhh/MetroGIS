[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metrogis"
version = "6.7.2.2.2"
description = "MetroGIS urban rail transit GIS toolkit"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "pyproj>=3.6",
]

[tool.setuptools.packages.find]
include = ["metrogis*"]

[tool.setuptools.package-data]
metrogis = ["**/*.yaml", "**/*.yml", "**/*.json"]
